version: "3.9"

services:
  # ─── MySQL ──────────────────────────────────────────────────────────────
  # Host machine connects on localhost:3307
  # Docker services connect on mysql:3306
  mysql:
    image: mysql:8.0
    container_name: smartrent-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: smartrent123
      MYSQL_DATABASE: smartrent
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/smartrent.sql:/docker-entrypoint-initdb.d/smartrent.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-psmartrent123",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  # ─── Zookeeper ──────────────────────────────────────────────────────────
  # ─── Zookeeper ──────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: smartrent-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "srvr,ruok"
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s


  # ─── Eureka Service Registry ───────────────────────────────────────────
  eureka-server:
    build:
      context: ./backend/eureka-server
      dockerfile: Dockerfile
    container_name: smartrent-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  # ─── Kafka ──────────────────────────────────────────────────────────────
  # Docker services use:  kafka:29092  (INTERNAL listener)
  # Host machine uses:    localhost:9092 (EXTERNAL listener)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: smartrent-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test:
        ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 40s

  # ─── User Auth Service ──────────────────────────────────────────────────
  user-auth-service:
    build:
      context: ./backend/user-auth-service
      dockerfile: Dockerfile
    container_name: smartrent-auth
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: smartrent
      DB_USER: root
      DB_PASS: smartrent123
      KAFKA_SERVERS: kafka:29092
      JWT_SECRET: SmartRentSuperSecretKeyForJWTGenerationAtLeast256BitsLong2024!
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8081/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  # ─── Property Service ───────────────────────────────────────────────────
  property-service:
    build:
      context: ./backend/property-service
      dockerfile: Dockerfile
    container_name: smartrent-property
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: smartrent
      DB_USER: root
      DB_PASS: smartrent123
      KAFKA_SERVERS: kafka:29092
      JWT_SECRET: SmartRentSuperSecretKeyForJWTGenerationAtLeast256BitsLong2024!
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8082/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  # ─── Rental Booking Service ─────────────────────────────────────────────
  rental-booking-service:
    build:
      context: ./backend/rental-booking-service
      dockerfile: Dockerfile
    container_name: smartrent-booking
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: smartrent
      DB_USER: root
      DB_PASS: smartrent123
      KAFKA_SERVERS: kafka:29092
      JWT_SECRET: SmartRentSuperSecretKeyForJWTGenerationAtLeast256BitsLong2024!
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8083/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  # ─── Engagement Notification Service ────────────────────────────────────
  engagement-notification-service:
    build:
      context: ./backend/engagement-notification-service
      dockerfile: Dockerfile
    container_name: smartrent-engagement
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_healthy
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: smartrent
      DB_USER: root
      DB_PASS: smartrent123
      KAFKA_SERVERS: kafka:29092
      JWT_SECRET: SmartRentSuperSecretKeyForJWTGenerationAtLeast256BitsLong2024!
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8084/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  # ─── API Gateway ────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: smartrent-gateway
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_healthy
      user-auth-service:
        condition: service_healthy
      property-service:
        condition: service_healthy
      rental-booking-service:
        condition: service_healthy
      engagement-notification-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_HOST: user-auth-service
      PROPERTY_SERVICE_HOST: property-service
      BOOKING_SERVICE_HOST: rental-booking-service
      ENGAGEMENT_SERVICE_HOST: engagement-notification-service
      JWT_SECRET: SmartRentSuperSecretKeyForJWTGenerationAtLeast256BitsLong2024!
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

  # ─── Frontend ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    container_name: smartrent-frontend
    restart: unless-stopped
    depends_on:
      - api-gateway
    ports:
      - "5173:80"

volumes:
  mysql_data:
