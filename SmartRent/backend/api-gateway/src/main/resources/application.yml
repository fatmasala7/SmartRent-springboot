server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
              - "http://frontend:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        # Auth Service
        - id: auth-register
          uri: lb://USER-AUTH-SERVICE
          predicates:
            - Path=/api/auth/**
          filters:
            - name: RemoveRequestHeader
              args:
                name: Cookie

        # User Service
        - id: user-service
          uri: lb://USER-AUTH-SERVICE
          predicates:
            - Path=/api/users/**
          filters:
            - JwtAuthFilter

        # Reviews - public GET (MUST be before /api/properties/** routes)
        - id: reviews-public
          uri: lb://ENGAGEMENT-NOTIFICATION-SERVICE
          predicates:
            - Path=/api/properties/*/reviews
            - Method=GET

        # Property Service - public GET routes (no auth needed)
        - id: property-public
          uri: lb://PROPERTY-SERVICE
          predicates:
            - Path=/api/properties/**
            - Method=GET
          filters:
            - name: RemoveRequestHeader
              args:
                name: Cookie

        # Property Service - protected routes
        - id: property-protected
          uri: lb://PROPERTY-SERVICE
          predicates:
            - Path=/api/properties/**
          filters:
            - JwtAuthFilter

        # Amenities - public GET
        - id: amenities-public
          uri: lb://PROPERTY-SERVICE
          predicates:
            - Path=/api/amenities/**
            - Method=GET

        # Amenities - protected
        - id: amenities-protected
          uri: lb://PROPERTY-SERVICE
          predicates:
            - Path=/api/amenities/**
          filters:
            - JwtAuthFilter

        # Visits
        - id: visits
          uri: lb://RENTAL-BOOKING-SERVICE
          predicates:
            - Path=/api/visits/**
          filters:
            - JwtAuthFilter

        # Applications
        - id: applications
          uri: lb://RENTAL-BOOKING-SERVICE
          predicates:
            - Path=/api/applications/**
          filters:
            - JwtAuthFilter

        # Rentals
        - id: rentals
          uri: lb://RENTAL-BOOKING-SERVICE
          predicates:
            - Path=/api/rentals/**
          filters:
            - JwtAuthFilter

        # Favorites
        - id: favorites
          uri: lb://ENGAGEMENT-NOTIFICATION-SERVICE
          predicates:
            - Path=/api/favorites/**
          filters:
            - JwtAuthFilter

        # Reviews - protected
        - id: reviews-protected
          uri: lb://ENGAGEMENT-NOTIFICATION-SERVICE
          predicates:
            - Path=/api/reviews/**
          filters:
            - JwtAuthFilter

        # Notifications
        - id: notifications
          uri: lb://ENGAGEMENT-NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**
          filters:
            - JwtAuthFilter


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:SmartRentSuperSecretKeyForJWTGenerationAtLeast256BitsLong2024!}

logging:
  level:
    com.smartrent: DEBUG
    org.springframework.cloud.gateway: DEBUG
